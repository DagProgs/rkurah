    <style>
        /* ПЕРЕМЕННЫЕ ЦВЕТОВ */
        :root {
            --accent: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --bg: #f8fafc;
            --glass: rgba(255, 255, 255, 0.85);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: rgba(226, 232, 240, 0.8);
            --shadow: rgba(0, 0, 0, 0.05);
            --item-bg: #f1f5f9;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --danger: #ef4444;
        }

        /* ТЕМНАЯ ТЕМА */
        body.dark-mode {
            --bg: #0f172a;
            --glass: rgba(30, 41, 59, 0.85);
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(51, 65, 85, 0.5);
            --shadow: rgba(0, 0, 0, 0.3);
            --item-bg: #334155;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: var(--bg);
            transition: background-color 0.5s ease;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            transition: background-color 0.5s ease, color 0.5s ease;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .header-content {
            text-align: center;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header-badge {
            margin-top: 4px;
            padding: 3px 14px;
            background: var(--accent-gradient);
            border-radius: 100px;
            font-size: 0.65rem;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2);
        }

        .theme-toggle {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: var(--item-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        /* --- MAIN --- */
        main {
            padding: 100px 16px 140px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* БЛОК ДЖУМА МУБАРАК */
        .juma-card {
            display: none;
            width: 100%;
            max-width: 480px;
            background: var(--accent-gradient);
            color: white;
            padding: 15px;
            border-radius: 25px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
            animation: slideUp 0.5s ease;
        }

        /* БЛОК ОБРАТНОГО ОТСЧЕТА И ПРОГРЕСС-БАРА */
        .countdown-container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--item-bg);
            border-radius: 25px;
            border: 1px solid var(--border);
            animation: slideUp 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .countdown-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .countdown-timer {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 10px;
        }

        /* ЗАПРЕТНОЕ ВРЕМЯ (МАКРУХ) */
        .forbidden-status {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            font-size: 0.65rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: pulseWarn 1.5s infinite;
        }

        @keyframes pulseWarn {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        .day-progress-wrapper {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .day-progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-gradient);
            transition: width 1s linear;
        }

        /* ТЕКСТ ОСТАВШЕГОСЯ ВРЕМЕНИ */
        .end-time-info {
            margin-top: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .end-time-info b {
            color: var(--text-main);
        }

        .tab-content {
            display: none;
            width: 100%;
            max-width: 480px;
            animation: slideUp 0.5s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 35px;
            padding: 25px 15px;
            box-shadow: 0 20px 40px var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .card-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .card-header h1 {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .card-header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* --- PRAYER ITEMS --- */
        .prayer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-radius: 24px;
            background: var(--item-bg);
            margin-bottom: 12px;
            border: 2px solid transparent;
            transition: var(--transition);
        }

        .prayer-item.active-now {
            background: var(--card-bg);
            border-color: var(--accent);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.15);
            transform: scale(1.03);
        }

        .prayer-item.active-now .name,
        .prayer-item.active-now .time {
            color: var(--accent);
        }

        .prayer-item .name {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .prayer-item .time {
            font-weight: 800;
            font-size: 1.2rem;
        }

        /* --- NIGHT CARD --- */
        .night-card {
            background: linear-gradient(to bottom right, var(--card-bg), var(--item-bg));
            border-radius: 30px;
            padding: 20px;
            border: 1px solid var(--border);
            width: 100%;
        }

        .night-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .night-box {
            text-align: center;
            padding: 15px 5px;
            background: var(--glass);
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .night-box .n-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 5px;
            display: block;
        }

        .night-box .n-time {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-main);
        }

        /* --- MONTH TABLE --- */
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .month-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .month-table th {
            padding: 12px 5px;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border);
            text-align: center;
        }

        .month-table td {
            padding: 14px 4px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .month-table tr.today-row {
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent);
            font-weight: 700;
        }

        /* --- YEAR GRID --- */
        .year-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .month-tile {
            background: var(--item-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px 5px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            color: var(--text-main);
        }

        .month-tile:active {
            transform: scale(0.9);
        }

        .month-tile.current {
            background: var(--accent-gradient);
            color: white;
            border: none;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        /* --- DOCK FOOTER --- */
        .dock-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .dock {
            display: flex;
            background: var(--glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 8px;
            border-radius: 32px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px var(--shadow);
            position: relative;
        }

        .nav-item {
            width: 85px;
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            cursor: pointer;
        }

        .icon-box {
            width: 24px;
            height: 24px;
            margin-bottom: 5px;
            color: var(--text-muted);
            transition: 0.3s;
        }

        .nav-item span {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .indicator {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 85px;
            height: calc(100% - 16px);
            background: var(--accent-gradient);
            border-radius: 24px;
            transition: var(--transition);
            z-index: 1;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .nav-item.active .icon-box,
        .nav-item.active span {
            color: white;
        }

        svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
        }
    </style>
</head>

<body class="light-mode">
    <header>
        <div class="header-content">
            <div class="header-title">Курахский р-он</div>
            <div class="header-badge">Рузнама</div>
        </div>
        <div class="theme-toggle" onclick="toggleTheme()">
            <svg id="theme-icon" viewBox="0 0 24 24" style="width:20px; height:20px; stroke: var(--text-main);">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </div>
    </header>
    <main>
        <div id="tab-today" class="tab-content active">
            <!-- Пятничное поздравление -->
            <div class="juma-card" id="juma-banner">Джума Мубарак!</div>

            <div class="countdown-container" id="countdown-box">
                <div class="forbidden-status" id="forbidden-tag"> Запретное время (Макрух)</div>
                <div class="countdown-label" id="next-prayer-name">До следующего намаза</div>
                <div class="countdown-timer" id="timer-val">00:00:00</div>
                <div class="day-progress-wrapper">
                    <div class="day-progress-fill" id="day-progress-bar"></div>
                </div>
                <!-- Текстовое уточнение до конца -->
                <div class="end-time-info" id="current-end-info"></div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h1 id="lbl-today">-- --</h1>
                    <p>Время намаза на сегодня</p>
                </div>
                <div id="list-today"></div>
            </div>
            <div class="night-card" id="night-block">
                <div class="night-grid">
                    <div class="night-box"><span class="n-label">Полночь</span>

                    </div>
                    <div class="night-box"><span class="n-label">1/3 ночи</span>

        <div id="tab-month" class="tab-content">

                <div class="card-header">

                </div>
                <div class="table-container">
                    <table class="month-table">

                            <tr>
                                <th>Дн</th>
                                <th>Фаджр</th>
                                <th>Восх</th>
                                <th>Зухр</th>
                                <th>Аср</th>
                                <th>Магр</th>
                                <th>Иша</th>
                            </tr>
                        </thead>
                        <tbody id="tbl-month"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div id="tab-year" class="tab-content">

                <div class="card-header">
                    <h1>2026</h1>

                </div>

            </div>
        </div>
    </main>
    <div class="dock-container">
        <nav class="dock">
            <div class="indicator" id="nav-indicator"></div>
            <div class="nav-item active" onclick="switchTab(0, 'today')">
                <div class="icon-box"><svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 6v6l4 2"></path>
                    </svg></div><span>Сегодня</span>
            </div>
            <div class="nav-item" onclick="switchTab(1, 'month')">
                <div class="icon-box"><svg viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg></div><span>Месяц</span>
            </div>
            <div class="nav-item" onclick="switchTab(2, 'year')">
                <div class="icon-box"><svg viewBox="0 0 24 24">
                        <path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1 3-6z"></path>
                    </svg></div><span>Год</span>
            </div>
        </nav>
    </div>
    <script>
        let ruznamaDB = { "January": {}, "February": {}, "March": {}, "April": {}, "May": {}, "June": {}, "July": {}, "August": {}, "September": {}, "October": {}, "November": {}, "December": {} };
        const mEN = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const mRU = ["Января", "Февраля", "Марта", "Апреля", "Мая", "Июня", "Июля", "Августа", "Сентября", "Октября", "Ноября", "Декабря"];
        const mFull = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        const pKeys = ["Fajr", "Sunrise", "Dhuhr", "Asr", "Maghrib", "Isha"];
        const pNames = ["Фаджр", "Восход", "Зухр", "Аср", "Магриб", "Иша"];
        let currentMonthIdx = new Date().getMonth();

        async function init() {
            try { const res = await fetch('assets/db/times_db.json'); if (res.ok) { ruznamaDB = await res.json(); } } catch (e) { console.log("Локальный режим"); }
            render(); startCountdown(); checkJuma();
        }

        function checkJuma() {
            const isFriday = new Date().getDay() === 5;
            document.getElementById('juma-banner').style.display = isFriday ? 'block' : 'none';
        }

        function fmt(time) { if (!time) return "--:--"; const [h, m] = time; return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`; }

        function render() {
            const now = new Date(), day = String(now.getDate()).padStart(2, '0'), month = mEN[now.getMonth()];
            document.getElementById('lbl-today').innerText = `${now.getDate()} ${mRU[now.getMonth()]}`;
            const todayData = ruznamaDB[month] ? ruznamaDB[month][day] : null;
            const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
            const nextDay = String(tomorrow.getDate()).padStart(2, '0'), nextMonth = mEN[tomorrow.getMonth()];
            const nextData = ruznamaDB[nextMonth] ? ruznamaDB[nextMonth][nextDay] : null;
            if (todayData) {
                document.getElementById('list-today').innerHTML = pKeys.map((k, i) => `<div class="prayer-item" id="prayer-${i}"><span class="name">${pNames[i]}</span><span class="time">${fmt(todayData[k])}</span></div>`).join('');
                highlightPrayer(todayData); updateProgressBar(todayData);
                if (nextData) {
                    const mTime = todayData.Maghrib[0] * 60 + todayData.Maghrib[1], fTime = (nextData.Fajr[0] + 24) * 60 + nextData.Fajr[1], dur = fTime - mTime;
                    const mid = (mTime + dur / 2) % 1440, third = (fTime - dur / 3) % 1440;
                    document.getElementById('val-midnight').innerText = fmt([Math.floor(mid / 60), Math.round(mid % 60)]);
                    document.getElementById('val-third').innerText = fmt([Math.floor(third / 60), Math.round(third % 60)]);
                }
            }
            renderMonthTable(currentMonthIdx);
            document.getElementById('grid-year').innerHTML = mFull.map((name, i) => `<div class="month-tile ${i === now.getMonth() ? 'current' : ''}" onclick="selectMonth(${i})">${name}</div>`).join('');
        }

        function updateProgressBar(data) {
            const now = new Date(), cur = now.getHours() * 60 + now.getMinutes(), bar = document.getElementById('day-progress-bar');
            const start = data.Fajr[0] * 60 + data.Fajr[1], end = data.Isha[0] * 60 + data.Isha[1];
            if (cur < start) bar.style.width = '0%'; else if (cur > end) bar.style.width = '100%'; else
                bar.style.width = ((cur - start) / (end - start)) * 100 + '%';
        }

        function startCountdown() {
            setInterval(() => {
                const now = new Date(), curSecs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds(), day = String(now.getDate()).padStart(2, '0'), month = mEN[now.getMonth()];
                const todayData = ruznamaDB[month] ? ruznamaDB[month][day] : null;

                // Данные на завтра для расчета конца Иша
                const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
                const nextDay = String(tomorrow.getDate()).padStart(2, '0'), nextMonth = mEN[tomorrow.getMonth()];
                const tomorrowData = ruznamaDB[nextMonth] ? ruznamaDB[nextMonth][nextDay] : null;

                if (!todayData) return;

                let nextIdx = -1;
                for (let i = 0; i < pKeys.length; i++) {
                    if ((todayData[pKeys[i]][0] * 60 + todayData[pKeys[i]][1]) * 60 > curSecs) { nextIdx = i; break; }
                }

                const timerEl = document.getElementById('timer-val'), labelEl = document.getElementById('next-prayer-name'), warnEl = document.getElementById('forbidden-tag');
                const endInfoEl = document.getElementById('current-end-info');

                let diffSecs = 0;
                let periodName = "";

                if (nextIdx !== -1) {
                    const [h, m] = todayData[pKeys[nextIdx]];
                    diffSecs = (h * 3600 + m * 60) - curSecs;

                    timerEl.innerText = `${String(Math.floor(diffSecs / 3600)).padStart(2, '0')}:${String(Math.floor((diffSecs % 3600) / 60)).padStart(2, '0')}:${String(diffSecs % 60).padStart(2, '0')}`;
                    labelEl.innerText = `До намаза ${pNames[nextIdx]}`;
                    warnEl.style.display = (diffSecs <= 900) ? 'block' : 'none';

                    if (nextIdx > 0) {
                        periodName = pNames[nextIdx - 1];
                        renderEndText(periodName, diffSecs, endInfoEl);
                    } else {
                        endInfoEl.innerText = `Ожидание Фаджра`;
                    }
                } else if (tomorrowData) {
                    // Логика конца Иша (до завтрашнего Фаджра)
                    const [h, m] = tomorrowData.Fajr;
                    diffSecs = (h * 3600 + m * 60 + 86400) - curSecs;
                    if (diffSecs > 86400) diffSecs -= 86400;

                    labelEl.innerText = `До намаза Фаджр (завтра)`;
                    timerEl.innerText = `${String(Math.floor(diffSecs / 3600)).padStart(2, '0')}:${String(Math.floor((diffSecs % 3600) / 60)).padStart(2, '0')}:${String(diffSecs % 60).padStart(2, '0')}`;
                    warnEl.style.display = 'none';

                    renderEndText("Иша", diffSecs, endInfoEl);
                }
            }, 1000);
        }

        function renderMonthTable(idx) {
            const mNameEN = mEN[idx], tbody = document.getElementById('tbl-month'), monthData = ruznamaDB[mNameEN] || {}, dNow = new Date().getDate(), mNow = new Date().getMonth();
            document.getElementById('lbl-month').innerText = mFull[idx];
            tbody.innerHTML = Object.keys(monthData).sort((a, b) => a - b).map(d => `<tr class="${(parseInt(d) === dNow && idx === mNow) ? 'today-row' : ''}"><td><b>${d}</b></td>${pKeys.map(k => `<td>${fmt(monthData[d][k])}</td>`).join('')}</tr>`).join('');
        }

        function selectMonth(i) { currentMonthIdx = i; renderMonthTable(i); switchTab(1, 'month'); }

        function highlightPrayer(data) {
            const cur = new Date().getHours() * 60 + new Date().getMinutes(); let active = -1;
            pKeys.forEach((k, i) => { if (cur >= (data[k][0] * 60 + data[k][1])) active = i; });
            document.querySelectorAll('.prayer-item').forEach(el => el.classList.remove('active-now'));
            if (active !== -1) document.getElementById(`prayer-${active}`)?.classList.add('active-now');
        }

        function switchTab(idx, id) {
            document.getElementById('nav-indicator').style.transform = `translateX(${idx * 100}%)`;
            document.querySelectorAll('.nav-item').forEach((item, i) => item.classList.toggle('active', i === idx));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active'); window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleTheme() {
            const body = document.body, icon = document.getElementById('theme-icon');
            body.classList.toggle('dark-mode'); const isDark = body.classList.contains('dark-mode');
            icon.innerHTML = isDark ? '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>' : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
            localStorage.setItem('ruznama-theme', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('ruznama-theme') === 'dark') document.body.classList.add('dark-mode');
        init(); setInterval(() => { render(); checkJuma(); }, 30000);
    </script>
