<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.ico" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="assets/css/style.css">
    <meta name="theme-color" content="#ffffff" id="theme-color">
    <meta name="google" content="notranslate">
    <title>Рузнама Курахский район</title>
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="description" content="Точное время обязательных намазов:
    сегодня - месяц - год">
    <meta name="keywords"
        content="Рузнама, Рузнама Курах, Курах, Курах рузнама, Курахский район, Времена намазов, времена намазов Курах, Кьурагь Дагълар">
    <meta name="robots" content="index,follow,noodp">
    <meta name="googlebot" content="index,follow">
    <meta name="google" content="nositelinkssearchbox">
    <meta name="google" content="notranslate">
    <meta name="google-site-verification" content="verification_token">
    <meta name="generator" content="WEB APP">
    <meta content="website">
    <link rel="manifest" href="manifest.json" />
    <script async src="pwacompat.min.js"></script>
    <script defer src="update.js" type="module"></script>
</head>

<body class="light-mode">

    <header>
        <div class="header-content">
            <div class="header-title">Курахский р-он</div>
            <div class="header-badge">Рузнама</div>
        </div>
        <div class="theme-toggle" onclick="toggleTheme()">
            <svg id="theme-icon" viewBox="0 0 24 24" style="width:20px; height:20px; stroke: var(--text-main);">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </div>
    </header>

    <main>
        <!-- ВКЛАДКА СЕГОДНЯ -->
        <div id="tab-today" class="tab-content active">
            <div class="juma-card" id="juma-banner">Джума Мубарак!</div>
            <div class="countdown-container" id="countdown-box">
                <div class="forbidden-status" id="forbidden-tag">Запретное время (Макрух)</div>
                <div class="countdown-label" id="next-prayer-name">Загрузка...</div>
                <div class="countdown-timer" id="timer-val">00:00:00</div>
                <div class="day-progress-wrapper">
                    <div class="day-progress-fill" id="day-progress-bar"></div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h1 id="lbl-today">-- --</h1>
                    <p>Время намаза на сегодня</p>
                </div>
                <div id="list-today"></div>
            </div>
        </div>

        <!-- ВКЛАДКА МЕСЯЦ -->
        <div id="tab-month" class="tab-content">
            <div class="card" style="padding: 20px 8px;">
                <div class="card-header">
                    <h1 id="lbl-month">Месяц</h1>
                    <p>Полное расписание</p>
                </div>
                <div class="table-container">
                    <table class="month-table">
                        <thead>
                            <tr>
                                <th>Дн</th>
                                <th>Фаджр</th>
                                <th>Шурук</th>
                                <th>Зухр</th>
                                <th>Аср</th>
                                <th>Магр</th>
                                <th>Иша</th>
                            </tr>
                        </thead>
                        <tbody id="tbl-month"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ВКЛАДКА ГОД -->
        <div id="tab-year" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <h1>2026</h1>
                    <p>Выберите месяц</p>
                </div>
                <div class="year-grid" id="grid-year"></div>
            </div>
        </div>
    </main>

    <div class="dock-container">
        <nav class="dock">
            <div class="indicator" id="nav-indicator"></div>
            <div class="nav-item active" onclick="switchTab(0, 'today')">
                <div class="icon-box"><svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 6v6l4 2"></path>
                    </svg></div>
                <span>Сегодня</span>
            </div>
            <div class="nav-item" onclick="switchTab(1, 'month')">
                <div class="icon-box"><svg viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg></div>
                <span>Месяц</span>
            </div>
            <div class="nav-item" onclick="switchTab(2, 'year')">
                <div class="icon-box"><svg viewBox="0 0 24 24">
                        <path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1 3-6z"></path>
                    </svg></div>
                <span>Год</span>
            </div>
        </nav>
    </div>

    <button id="btnNotify" style="padding: 10px; background: #252e49; color: white; border: none; border-radius: 5px;">
        Включить уведомления об Азане
    </button>
    <script>
        document.getElementById('btnNotify').addEventListener('click', async () => {
            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                alert('Уведомления включены! Теперь вы не пропустите азан.');
                // Принудительно запускаем проверку сразу после подписки
                navigator.serviceWorker.ready.then(registration => {
                    registration.active.postMessage({ type: 'CHECK_NOW' });
                });
            } else {
                alert('Вы отклонили доступ к уведомлениям.');
            }
        });
    </script>
    <script src="assets/js/script.js"></script>
    <script type="text/javascript" src="runtime.js"></script>
    <script type="text/javascript" src="polyfills.js"></script>
    <script type="text/javascript" src="main.js"></script>
    <script src="assets/js/theme.js"></script>
</body>

</html>
